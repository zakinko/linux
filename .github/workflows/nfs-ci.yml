name: nfs-ci

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev dwarves \
            python3-pip qemu-system-x86 nfs-kernel-server acl nfs4-acl-tools rdma-core ibverbs-utils
          sudo pip3 install --break-system-packages virtme-ng
          sudo chmod 666 /dev/kvm

      - name: Configure
        run: |
          vng --kconfig $(sed -e '/^#/d' -e '/^$/d' -e 's/^/--configitem /' .github/ci/kconfig)
          make -s olddefconfig
          missing=0
          for item in $(grep -v '^#' .github/ci/kconfig); do
            grep -qx "$item" .config || { echo "not set: $item"; missing=1; }
          done
          exit $missing

      - name: Build
        run: make -k -s -j$(nproc) bzImage modules

      - name: W=1 on nfsd
        run: |
          touch fs/nfsd/nfs3proc.c fs/nfsd/nfs4proc.c fs/nfsd/vfs.c
          make -s W=1 fs/nfsd/nfs3proc.o fs/nfsd/nfs4proc.o fs/nfsd/vfs.o 2>&1 | tee w1.log
          ! grep -E 'warning:' w1.log

      - name: Fetch pynfs
        continue-on-error: true
        run: |
          sudo apt-get install -qy --no-install-recommends python3-ply libkrb5-dev swig python3-dev python3-setuptools python3-gssapi
          git clone -q --depth 1 git://linux-nfs.org/~bfields/pynfs.git .pynfs
          (cd .pynfs && ./setup.py build) | tail -3

      - name: Test
        run: |
          for t in .github/ci/test-*.sh; do
            echo "::group::$t"
            vng --run . --user root --cpus 4 --memory 4G \
              --rwdir /tmp --exec "sh $t" 2>&1 | tee /tmp/$(basename $t).log
            echo "::endgroup::"
          done
          # "! grep" would not trip bash -e; fail explicitly.
          if grep -h 'FAIL:' /tmp/test-*.sh.log; then
            exit 1
          fi
          for t in .github/ci/test-*.sh; do
            grep -q 'PASS:' /tmp/$(basename $t).log || { echo "no result: $t"; exit 1; }
          done
